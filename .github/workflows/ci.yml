name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref to keep feedback fast and CI cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        env:
          # Skip env validation during lint — env vars are validated at runtime
          SKIP_ENV_VALIDATION: 'true'

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: 'true'
